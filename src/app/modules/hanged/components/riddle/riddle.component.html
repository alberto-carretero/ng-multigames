<div class="riddle d-flex flex-wrap justify-content-center align-items-center mt-3">
  <ng-container *ngFor="let letter of (hangedData | async)?.lettersRiddle">
    <div class="text-center mx-2" [class.riddle__letter]="letter.name !== ''">
      <span [class.riddle__letter--hidden]="!letter.isSelected">{{ letter.name }}</span>
    </div>
  </ng-container>
</div>
